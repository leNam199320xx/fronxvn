<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Visual Editor</title>
    <link rel="stylesheet" href="src/studio/styles/editor.css">
</head>
<body>
    <div class="editor-layout">
        <!-- Top Toolbar -->
        <div class="editor-toolbar">
            <div class="toolbar-group">
                <button id="btn-undo" title="Undo (Ctrl+Z)">↶</button>
                <button id="btn-redo" title="Redo (Ctrl+Shift+Z)">↷</button>
            </div>
            <div class="toolbar-separator"></div>
            <div class="toolbar-group">
                <button id="btn-zoom-out" title="Zoom Out">−</button>
                <span class="zoom-display" id="zoom-display">100%</span>
                <button id="btn-zoom-in" title="Zoom In">+</button>
                <button id="btn-zoom-reset" title="Reset Zoom">⟲</button>
            </div>
            <div class="toolbar-separator"></div>
            <div class="toolbar-group">
                <span id="project-name" class="project-name" title="Click to rename project">My Project</span>
            </div>
            <div class="toolbar-separator"></div>
            <div class="toolbar-group">
                <button id="btn-toggle-grid" title="Toggle Grid" class="active">Grid</button>
            </div>
            <div class="toolbar-separator"></div>
            <div class="toolbar-group">
                <button id="btn-align-left" title="Align Left">⫷</button>
                <button id="btn-align-center" title="Align Center H">⫿</button>
                <button id="btn-align-right" title="Align Right">⫸</button>
                <button id="btn-align-top" title="Align Top">⊤</button>
                <button id="btn-align-middle" title="Align Middle V">⊶</button>
                <button id="btn-align-bottom" title="Align Bottom">⊥</button>
                <button id="btn-full-width" title="Full Width">↔W</button>
                <button id="btn-full-height" title="Full Height">↕H</button>
            </div>
            <div class="toolbar-separator"></div>
            <div class="toolbar-group">
                <button id="btn-export" title="Export">Export</button>
                <button id="btn-save" title="Save">Save</button>
                <button id="btn-load" title="Load">Load</button>
            </div>
            <div class="toolbar-separator"></div>
            <div class="toolbar-group">
                <button id="btn-new-project" title="New Project">📄 New</button>
            </div>
            <div class="toolbar-separator"></div>
            <div class="toolbar-group" id="viewport-switcher">
                <button id="btn-bp-desktop" class="active" title="Desktop" data-bp="desktop">🖥</button>
                <button id="btn-bp-tablet" title="Tablet" data-bp="tablet">📱</button>
                <button id="btn-bp-mobile" title="Mobile" data-bp="mobile">📲</button>
            </div>
            <div class="toolbar-separator"></div>
            <div class="toolbar-group">
                <button id="btn-toggle-left" title="Toggle Left Toolbar" class="active">◀</button>
                <button id="btn-toggle-right" title="Toggle Right Toolbar" class="active">▶</button>
            </div>
            <div class="toolbar-separator"></div>
            <div class="toolbar-group">
                <button id="btn-fullscreen" title="Toggle Fullscreen">⛶</button>
            </div>
            <div class="toolbar-separator"></div>
            <div class="toolbar-group">
                <button id="btn-quality" class="quality-score-btn" title="HTML Quality Score">
                    <span id="quality-score-label">Q: —</span>
                </button>
            </div>
            <span class="coords-display" id="coords-display">X: 0 Y: 0</span>
        </div>

        <!-- Page Tab Bar -->
        <div id="page-tab-bar"></div>

        <!-- Main area -->
        <div class="editor-main">
            <!-- Left Toolbar: Properties (vertical icon bar) -->
            <div class="toolbar-left" id="toolbar-left">
                <button class="toolbar-icon active" data-panel="properties" title="Properties">⚙</button>
                <button class="toolbar-icon" data-panel="layers" title="Layers">☰</button>
                <button class="toolbar-icon" data-panel="components" title="Components">⬡</button>
            </div>

            <!-- Left Floating Panel -->
            <div class="panel-float panel-float-left" id="panel-left">
                <div class="panel-section">
                    <div class="panel-section-header">Properties <span class="arrow">▼</span></div>
                    <div class="panel-section-body"></div>
                </div>
            </div>

            <!-- Canvas -->
            <div class="canvas-wrapper" id="canvas-wrapper">
                <div class="canvas-container" id="canvas-container">
                    <div class="canvas-inner" id="canvas-inner">
                        <div class="canvas show-grid" id="canvas"></div>
                    </div>
                </div>
                <div class="overlay-layer" id="overlay-layer"></div>
            </div>

            <!-- Right Floating Panel -->
            <div class="panel-float panel-float-right" id="panel-right"></div>

            <!-- Right Toolbar: vertical icon bar -->
            <div class="toolbar-right" id="toolbar-right">
                <button class="toolbar-icon active" data-panel="elements" title="Elements">□</button>
                <button class="toolbar-icon" data-panel="templates" title="Templates">📋</button>
                <button class="toolbar-icon" data-panel="theme" title="Theme">🎨</button>
                <button class="toolbar-icon" data-panel="quality" title="Quality">✓</button>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="context-menu"></div>

    <script type="module" src="src/studio/bootstrap/main.js"></script>
</body>
</html>
